# ---------------------------------------------------------------------------
# Order fulfillment — distributed saga with compensation + signals.
#
# Stack:
#   postgres            — workflow storage + step queue
#   migrator            — one-shot drizzle migrations, then exits
#   coordinator         — leader, submits demo orders, delivers "shipped"
#                         signal a few seconds after each submission
#   worker-inventory    — claims needs=["inventory"] (reserve-inventory)
#   worker-payment      — claims needs=["payment"] (charge-payment)
#   worker-shipping     — claims needs=["shipping"] (generate-label)
#   worker-default      — claims tasks with no needs (notify-warehouse +
#                         mark-delivered)
#
# Tail the stack:
#   docker compose up --build
#
# Scale a worker pool:
#   docker compose up --scale worker-payment=3
#
# Watch a single order's journey:
#   docker compose logs -f coordinator | grep demo-order-1
# ---------------------------------------------------------------------------

name: promin-order-fulfillment

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: promin
      POSTGRES_PASSWORD: promin
      POSTGRES_DB: promin
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promin -d promin"]
      interval: 2s
      timeout: 2s
      retries: 10

  migrator:
    build:
      context: ../../../
      dockerfile: examples/docker/order-fulfillment/Dockerfile
    command: ["bun", "--conditions=@promin/source", "run", "migrator.ts"]
    environment:
      DATABASE_URL: postgres://promin:promin@postgres:5432/promin
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  coordinator:
    build:
      context: ../../../
      dockerfile: examples/docker/order-fulfillment/Dockerfile
    command: ["bun", "--conditions=@promin/source", "run", "coordinator.ts"]
    environment:
      DATABASE_URL: postgres://promin:promin@postgres:5432/promin
      SUBMIT_INTERVAL_MS: "6000"
      SHIP_AFTER_MS: "3000"
    depends_on:
      migrator:
        condition: service_completed_successfully

  worker-inventory:
    build:
      context: ../../../
      dockerfile: examples/docker/order-fulfillment/Dockerfile
    command: ["bun", "--conditions=@promin/source", "run", "worker-inventory.ts"]
    environment:
      DATABASE_URL: postgres://promin:promin@postgres:5432/promin
    depends_on:
      migrator:
        condition: service_completed_successfully

  worker-payment:
    build:
      context: ../../../
      dockerfile: examples/docker/order-fulfillment/Dockerfile
    command: ["bun", "--conditions=@promin/source", "run", "worker-payment.ts"]
    environment:
      DATABASE_URL: postgres://promin:promin@postgres:5432/promin
    depends_on:
      migrator:
        condition: service_completed_successfully

  worker-shipping:
    build:
      context: ../../../
      dockerfile: examples/docker/order-fulfillment/Dockerfile
    command: ["bun", "--conditions=@promin/source", "run", "worker-shipping.ts"]
    environment:
      DATABASE_URL: postgres://promin:promin@postgres:5432/promin
    depends_on:
      migrator:
        condition: service_completed_successfully

  worker-default:
    build:
      context: ../../../
      dockerfile: examples/docker/order-fulfillment/Dockerfile
    command: ["bun", "--conditions=@promin/source", "run", "worker-default.ts"]
    environment:
      DATABASE_URL: postgres://promin:promin@postgres:5432/promin
    depends_on:
      migrator:
        condition: service_completed_successfully
