name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      docs-only:
        description: "Deploy docs only (skip CI and release)"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  id-token: write
  pages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    if: ${{ !inputs.docs-only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install

      - name: Typecheck
        run: bunx nx run-many -t typecheck

      - name: Lint
        run: bunx nx run-many -t lint

      - name: Unit tests
        run: bun run test

  release:
    if: ${{ !inputs.docs-only }}
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Set version in all packages
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          for pkg in packages/*/package.json; do
            # Skip private packages
            if jq -e '.private == true' "$pkg" > /dev/null 2>&1; then
              echo "Skipping private: $pkg"
              continue
            fi
            jq --arg v "$VERSION" '.version = $v' "$pkg" > tmp.json && mv tmp.json "$pkg"
            echo "Set $(jq -r .name "$pkg") → $VERSION"
          done

      - name: Build packages
        run: bun run build

      - name: Publish to npm
        run: |
          for pkg in packages/*/; do
            if jq -e '.private == true' "$pkg/package.json" > /dev/null 2>&1; then
              continue
            fi
            echo "Publishing $(jq -r .name "$pkg/package.json")..."
            cd "$pkg"
            npm publish --access public
            cd "$GITHUB_WORKSPACE"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docs:
    if: ${{ !inputs.docs-only }}
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: bun install

      - name: Build docs
        run: bun run docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .target/docs

  docs-only:
    if: ${{ inputs.docs-only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: bun install

      - name: Build docs
        run: bun run docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .target/docs

  deploy-docs:
    needs: [docs, docs-only]
    if: ${{ !cancelled() && (needs.docs.result == 'success' || needs.docs-only.result == 'success') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
