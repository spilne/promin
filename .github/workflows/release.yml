name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  BUN_VERSION: "1.4.4"
  NX_DAEMON: "false"
  NX_ISOLATE_PLUGINS: "false"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Verify immutable tag and shared package versions
        run: bun run release:verify
      - run: bun run ci
      - run: bun run test:e2e
      - name: Build and validate every release artifact
        run: bun run release:check
      - name: Migrate from the packed Postgres package
        run: bun run test:packages
      - name: Build documentation before publishing
        run: bun run documentation:build:html
      - name: Publish packages in dependency order
        run: bun run release:publish
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: documentation/.vitepress/dist

  deploy-docs:
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
