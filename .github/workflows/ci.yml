name: CI

on:
  push:
    branches-ignore:
      - main

permissions:
  actions: read
  contents: read

jobs:
  # Fast: typecheck + lint + unit tests (no Docker needed)
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - run: bun install --no-cache

      - name: Typecheck
        run: bunx nx run-many -t typecheck

      - name: Lint
        run: bunx nx run-many -t lint

      - name: Unit tests
        run: bun run test

      - name: Benchmarks
        run: bun run packages/core/src/lib/stream-pipeline.bench.ts 2>&1 | tee bench-output.txt

      - name: Benchmark report
        if: always()
        run: |
          # Strip ANSI codes and write to job summary
          echo '## Benchmark Report' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          sed 's/\x1b\[[0-9;]*m//g' bench-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench-output.txt

  # Slower: integration tests with testcontainers (Kafka, Redis, Postgres)
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - run: bun install --no-cache

      - name: Integration tests
        run: bun run test:integration
