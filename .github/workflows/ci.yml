name: CI

on:
  push:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".beads/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".beads/**"
      - "LICENSE"

permissions:
  actions: read
  contents: read

jobs:
  # Fast: typecheck + lint + unit tests (no Docker needed)
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install

      - name: Typecheck
        run: bunx nx run-many -t typecheck

      - name: Lint
        run: bunx nx run-many -t lint

      - name: Unit tests
        run: bun run test

  # Benchmarks: runs in parallel with unit + integration
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install

      - name: Stream benchmarks
        run: |
          mkdir -p .target/reports
          bun run bench:stream 2>&1 | tee .target/reports/stream-bench.txt

      - name: Workflow benchmarks
        run: |
          mkdir -p .target/reports
          bun run bench:workflow 2>&1 | tee .target/reports/workflow-bench.txt

      - name: Cross-language benchmarks
        continue-on-error: true
        run: |
          # Install uv for Python dependency management
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          bun run bench || true

      - name: Publish benchmark report
        if: always()
        run: |
          # Stream benchmarks → job summary
          echo '## Stream Benchmark Report' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          sed 's/\x1b\[[0-9;]*m//g' .target/reports/stream-bench.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          # Workflow benchmarks → job summary
          echo '## Workflow Benchmark Report' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          sed 's/\x1b\[[0-9;]*m//g' .target/reports/workflow-bench.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          # Cross-language report → job summary (already markdown)
          cat .target/reports/benchmark-latest.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || true

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: .target/reports/
          if-no-files-found: ignore

  # Slower: integration tests with testcontainers (Kafka, Redis, Postgres)
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install

      - name: Pre-pull test container images
        run: |
          docker pull redpandadata/redpanda:v24.3.7 &
          docker pull redis:7-alpine &
          docker pull postgres:17-alpine &
          docker pull confluentinc/cp-kafka:7.9.1 &
          docker pull ghcr.io/pgmq/pg17-pgmq:latest &
          wait

      - name: Integration tests
        run: bun run test:integration
