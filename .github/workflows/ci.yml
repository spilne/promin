name: CI

on:
  push:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".beads/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".beads/**"
      - "LICENSE"

permissions:
  actions: read
  contents: read

jobs:
  # The jobs below run in parallel; CI wall time is the slowest of them.

  # Typecheck + lint
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install

      - name: Typecheck
        run: bunx nx run-many -t typecheck

      - name: Lint
        run: bunx nx run-many -t lint

      - name: Format check
        run: bunx nx run-many -t format-check

  # Every package's tests: one nx task per package, in parallel, resolving
  # workspace packages to their sources (Postgres/Redis store tests use
  # testcontainers).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install

      - name: Pre-pull test container images
        run: |
          docker pull redis:7-alpine &
          docker pull postgres:17-alpine &
          wait

      - name: Tests
        run: bun run test

  # The demo agents' eval suites with scripted LLMs (offline, seconds): fails
  # when a score drops below packages/zorya/examples/evals/thresholds.json.
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install

      - name: Eval suites
        run: bun run evals:ci --report eval-report.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json
          if-no-files-found: ignore

  # Zorya worker-driven runs across real processes on Postgres (spawned hosts
  # and workers, kill -9, restarts): minutes of wall time, so its own job.
  zorya-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install

      - name: Pre-pull test container images
        run: docker pull postgres:17-alpine

      - name: End-to-end tests
        run: bun run test:e2e

  # Zorya dashboard bundle + Docker image, smoke-tested by serving the dashboard.
  zorya-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install

      - name: Build UI
        run: bun run build:ui

      - name: Docker build
        run: docker build -f packages/zorya/Dockerfile -t zorya:ci .

      - name: Serve the dashboard
        run: |
          docker run -d --name zorya-ci -p 4100:4100 -e ZORYA_API_KEY=ci-operator-key -e ZORYA_WORKER_API_KEY=ci-worker-key zorya:ci
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:4100/api/health && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:4100/api/ready
          curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4100/api/runs | grep -q 401
          curl -sf -o /dev/null -H 'authorization: Bearer ci-operator-key' http://127.0.0.1:4100/api/runs
          curl -sf http://127.0.0.1:4100/ | grep -q '<div id="app">'
          curl -sf -o /dev/null http://127.0.0.1:4100/app.js
          curl -sf -o /dev/null http://127.0.0.1:4100/app.css

      - name: Container logs
        if: always()
        run: docker logs zorya-ci || true

  # Benchmarks: runs in parallel with the other jobs
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install

      - name: DataFrame benchmarks
        run: |
          set -o pipefail
          mkdir -p .target/reports
          bun run bench:dataframe 2>&1 | tee .target/reports/dataframe-bench.txt

      - name: Workflow benchmarks
        run: |
          set -o pipefail
          mkdir -p .target/reports
          bun run bench:workflow 2>&1 | tee .target/reports/workflow-bench.txt

      - name: Cross-language benchmarks
        continue-on-error: true
        run: |
          # Install uv for Python dependency management
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          bun run bench || true

      - name: Publish benchmark report
        if: always()
        run: |
          # DataFrame benchmarks → job summary
          echo '## DataFrame Benchmark Report' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          sed 's/\x1b\[[0-9;]*m//g' .target/reports/dataframe-bench.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          # Workflow benchmarks → job summary
          echo '## Workflow Benchmark Report' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          sed 's/\x1b\[[0-9;]*m//g' .target/reports/workflow-bench.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          # Cross-language report → job summary (already markdown)
          cat .target/reports/benchmark-latest.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || true

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: .target/reports/
          if-no-files-found: ignore
