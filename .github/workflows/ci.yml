name: CI

on:
  push:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  # Fast: typecheck + lint + unit tests (no Docker needed)
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - run: bun install --no-cache

      - name: Typecheck
        run: bunx nx run-many -t typecheck

      - name: Lint
        run: bunx nx run-many -t lint

      - name: Unit tests
        run: bun run test

      - name: Stream benchmarks
        run: |
          mkdir -p .target/reports
          bun run packages/core/src/lib/stream-pipeline.bench.ts 2>&1 | tee .target/reports/stream-bench.txt

      - name: Cross-language benchmarks
        continue-on-error: true
        run: |
          # Install uv for Python dependency management
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          bun run bench || true

      - name: Publish benchmark report
        if: always()
        run: |
          # Stream benchmarks → job summary
          echo '## Stream Benchmark Report' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          sed 's/\x1b\[[0-9;]*m//g' .target/reports/stream-bench.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          # Cross-language report → job summary (already markdown)
          cat .target/reports/benchmark-latest.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || true

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: .target/reports/
          if-no-files-found: ignore

  # Slower: integration tests with testcontainers (Kafka, Redis, Postgres)
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - run: bun install --no-cache

      - name: Integration tests
        run: bun run test:integration
