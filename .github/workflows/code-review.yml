name: AI Code Review

on:
  # Automatic PR review when changes are pushed
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '**/.nx/cache/**'
      - '**/dist/**'
      - '**/node_modules/**'
      - '**/drizzle/meta/**'
      - '**/*.d.ts'
      - 'package.json'
      - 'bun.lockb'
      - '*.lock'
      - '.env*'
      - '**/*.yml'
      - '**/*.yaml'
      - '.oxlintrc.json'
      - '.oxfmtrc.json'
      - '**/values/**'

  # Respond to @claude mentions in comments
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

  # Allow manual trigger
  workflow_dispatch:

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Only respond to @claude mentions, skip bot comments
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
        github.event.comment.user.type != 'Bot' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
        github.event.comment.user.type != 'Bot' &&
        contains(github.event.comment.body, '@claude'))

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a TypeScript backend service in the ts-backend monorepo.

            Read these files for conventions (MANDATORY):
            1. /CLAUDE.md - Core project conventions
            2. /.claude/code-review-guide.md - Review checklist with anti-patterns

            Focus areas (in priority order):
            1. Security & Validation (SQL injection, XSS, auth bypass, hardcoded secrets)
            2. Service Pattern (DI, interfaces, LoggerFactory placement)
            3. TypeScript Conventions (parameter objects, import order, naming)
            4. Route Pattern (Hono + OpenAPI + Zod validation)
            5. Configuration (parseFromEnv, Zod schemas, env variable rules)
            6. Error Handling (custom errors, structured logging)

            Severity levels:
            - 🚨 CRITICAL: Security vulnerabilities, data corruption risks
            - ⚠️ HIGH: Convention violations from CLAUDE.md, maintainability issues
            - 💡 MEDIUM: Code quality improvements, optimization opportunities
            - 📝 LOW: Style suggestions, minor improvements

            Guidelines:
            - Be concise and actionable
            - Provide code examples for corrections
            - Skip formatting suggestions (oxfmt handles it automatically)
            - Use `gh pr comment` for top-level summary feedback
            - Use `mcp__github_inline_comment__create_inline_comment` to highlight specific code issues
            - Focus on violations that impact correctness, security, or maintainability
            - Ignore build artifacts, generated files, and configuration files (they're excluded)

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*)"
