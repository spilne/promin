<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zorya</title>
    <!-- Inter (variable). Body styles target its `cv01..cv11` character
         variants — without the font actually loaded the feature-settings
         no-op against the browser's default serif fallback, which is why
         text on the dashboard read fuzzier than shadcn's. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body class="min-h-screen bg-base-200 text-base-content">
    <div id="app"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
